# Human-readable labels for every ref used in rules.yaml.
# PDPL article numbers VERIFIED on 2026-10-24 against the official English translation published by MoDEE:
# https://www.modee.gov.jo/EBV4.0/Root_Storage/EN/1/PDP_Law_-_English_Version-_officail_translation.pdf
# NCSC framework control numbers are NOT public — they stay null and show as "control to be confirmed".
# article: the verified article number, or null if NOBODY has checked the official text yet.
# The UI shows "article to be confirmed" when article is null. Fill these in from the official PDPL / NCSC PDFs.
# query: what the RAG searches for to find the right article text.

PDPL:dpo:
  label: "Jordan PDPL — Data Protection Officer"
  label_ar: "قانون حماية البيانات الشخصية — تعيين المراقب (مسؤول حماية البيانات)"
  article: "Art. 11(A)"        # official MoDEE English translation: Art. 11(A)(1)–(6)
  query: "data protection officer appoint controller sensitive transfer outside Kingdom المراقب تعيين"
PDPL:periodic_assessment:
  label: "Jordan PDPL — periodic assessment of data systems"
  label_ar: "قانون حماية البيانات الشخصية — التقييم الدوري لأنظمة المعالجة"
  article: "Art. 11(B)(2)"        # official translation
  query: "periodic assessment evaluation database processing systems security تقييم دوري"
PDPL:consent:
  label: "Jordan PDPL — consent"
  label_ar: "قانون حماية البيانات الشخصية — الموافقة"
  article: "Art. 4(A), Art. 5"        # official translation
  query: "consent data subject prior explicit processing موافقة الشخص المعني"
PDPL:transparency:
  label: "Jordan PDPL — informing the data subject"
  label_ar: "قانون حماية البيانات الشخصية — إعلام الشخص المعني"
  article: "Art. 9"        # official translation
  query: "inform data subject purpose controller identity إعلام الشخص المعني"
PDPL:data_subject_rights:
  label: "Jordan PDPL — data subject rights"
  label_ar: "قانون حماية البيانات الشخصية — حقوق الشخص المعني"
  article: "Art. 4(B)"        # official translation
  query: "right access correct erase object withdraw consent portability حقوق الشخص المعني"
PDPL:purpose_limitation:
  label: "Jordan PDPL — lawful, specified purpose"
  label_ar: "قانون حماية البيانات الشخصية — تحديد الغاية المشروعة"
  article: "Art. 7"        # official translation
  query: "specific lawful purpose limitation processing غاية مشروعة محددة"
PDPL:security_of_processing:
  label: "Jordan PDPL — security of processing"
  label_ar: "قانون حماية البيانات الشخصية — أمن المعالجة"
  article: "Art. 8(B)"        # official translation
  query: "technical organizational measures protect data security safeguards تدابير فنية وتنظيمية"
PDPL:cross_border_transfer:
  label: "Jordan PDPL — transfer of data outside Jordan"
  label_ar: "قانون حماية البيانات الشخصية — نقل البيانات خارج المملكة"
  article: "Art. 15"        # official translation
  query: "transfer personal data outside Jordan level of protection نقل البيانات خارج المملكة"
PDPL:penalties:
  label: "Jordan PDPL — administrative and criminal penalties"
  label_ar: "قانون حماية البيانات الشخصية — العقوبات الإدارية والجزائية"
  article: "Art. 21–22"        # official translation
  query: "penalties fine daily 500 dinars 3% revenue criminal fine 1000 10000 العقوبات غرامة"
PDPL:breach_notification:
  label: "Jordan PDPL — breach notification"
  label_ar: "قانون حماية البيانات الشخصية — الإخلال بأمن وسلامة البيانات والإبلاغ عنه"
  article: "Art. 20(A)"        # official translation
  query: "breach security integrity notify 24 hours 72 hours unit data subject الإخلال بأمن وسلامة البيانات"

